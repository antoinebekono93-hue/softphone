name: eSIM Billing Cron

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  esim-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger eSIM Billing Endpoint
        run: |
          # Make sure to configure BASE_URL and CRON_SECRET in your GitHub Secrets
          # BASE_URL should be your production URL, e.g., https://your-app.com
          curl -X GET "${{ secrets.BASE_URL }}/api/cron/esim-billing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f || exit 1
