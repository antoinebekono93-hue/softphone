# Fly.io configuration for Media WebSocket Server
# Deploy with: fly launch --dockerfile Dockerfile.media-server --name antigravity-media-server

app = "antigravity-media-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.media-server"

[env]
  NODE_ENV = "production"
  # Set these via: fly secrets set KEY=value
  # DATABASE_URL = ""
  # OPENAI_API_KEY = ""
  # TELNYX_API_KEY = ""
  # TELNYX_PUBLIC_KEY = ""
  # TELNYX_SIP_CONNECTION_ID = ""
  # AUTH_SECRET = ""
  # ENCRYPTION_KEY = ""
  # CRON_SECRET = ""
  # NEXT_PUBLIC_PUSHER_KEY = ""
  # NEXT_PUBLIC_PUSHER_CLUSTER = ""
  # STRIPE_SECRET_KEY = ""
  # STRIPE_WEBHOOK_SECRET = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  ports = [{port = "8080", handlers = ["tls"]}]
  # Health check on HTTP port 3001
  [services.http_checks]
    interval = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    port = 3001
    timeout = "5s"
    tls_skip_verify = true

[metrics]
  port = 9090
  path = "/metrics"

[experimental]
  allowed_public_ports = [8080]
  auto_rollback = true